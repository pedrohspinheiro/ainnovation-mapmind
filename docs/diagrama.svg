<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 110 1600 610" width="1600" height="610" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#186C7D"/>
    </marker>
  </defs>
  <rect y="110" width="1600" height="610" fill="#ffffff"/>

  <!-- arrows (drawn first so boxes sit on top) -->
  <g stroke="#186C7D" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M190 330 H292"/>
    <path d="M520 330 H592"/>
    <path d="M860 330 H952"/>
    <path d="M1300 330 H1352"/>
    <path d="M730 560 V398"/>
    <path d="M820 590 H952"/>
  </g>

  <!-- arrow labels -->
  <g fill="#0B2B4C" font-size="17" text-anchor="middle">
    <text x="243" y="296">nome +</text>
    <text x="243" y="316">4 respostas</text>
    <text x="906" y="290">top 3 +</text>
    <text x="906" y="310">palavras</text>
    <text x="906" y="362" fill="#5f7484">ou confiança</text>
    <text x="906" y="382" fill="#5f7484">baixa</text>
  </g>

  <!-- Estudante -->
  <rect x="20" y="298" width="170" height="64" rx="32" fill="#0B2B4C"/>
  <text x="105" y="337" fill="#fff" font-size="22" font-weight="bold" text-anchor="middle">Estudante</text>

  <!-- Webapp -->
  <rect x="300" y="276" width="220" height="108" rx="14" fill="#0B2B4C"/>
  <text x="410" y="322" fill="#fff" font-size="22" font-weight="bold" text-anchor="middle">Webapp</text>
  <text x="410" y="352" fill="#cfe0ea" font-size="17" text-anchor="middle">recolhe o perfil</text>

  <!-- Matriz (hexagon) -->
  <polygon points="630,262 830,262 860,330 830,398 630,398 600,330" fill="#46C1A9"/>
  <text x="730" y="312" fill="#0B2B4C" font-size="22" font-weight="bold" text-anchor="middle">Matriz de</text>
  <text x="730" y="340" fill="#0B2B4C" font-size="22" font-weight="bold" text-anchor="middle">compatibilidade</text>
  <text x="730" y="370" fill="#0B2B4C" font-size="17" text-anchor="middle">calculada em código</text>

  <!-- data.xlsx (cylinder) -->
  <path d="M640 575 V665 A90 18 0 0 0 820 665 V575" fill="#e9f6f3" stroke="#186C7D" stroke-width="2"/>
  <ellipse cx="730" cy="575" rx="90" ry="18" fill="#e9f6f3" stroke="#186C7D" stroke-width="2"/>
  <text x="730" y="625" fill="#0B2B4C" font-size="20" font-weight="bold" text-anchor="middle">data.xlsx</text>
  <text x="730" y="652" fill="#3d5568" font-size="16" text-anchor="middle">15 áreas · instituições</text>

  <!-- Agente -->
  <rect x="960" y="150" width="340" height="460" rx="18" fill="#f3f7f8" stroke="#186C7D" stroke-width="2.5"/>
  <text x="1130" y="186" fill="#0B2B4C" font-size="20" font-weight="bold" text-anchor="middle">Agente</text>
  <text x="1130" y="210" fill="#3d5568" font-size="15" text-anchor="middle">Gemini + LangGraph</text>
  <g font-size="17" text-anchor="middle">
    <rect x="985" y="230" width="290" height="104" rx="12" fill="#186C7D"/>
    <text x="1130" y="272" fill="#fff" font-weight="bold" font-size="19">system.md</text>
    <text x="1130" y="300" fill="#d9eef1">regras · clarificação · cuidados</text>

    <rect x="985" y="352" width="290" height="104" rx="12" fill="#186C7D"/>
    <text x="1130" y="394" fill="#fff" font-weight="bold" font-size="19">areas_retriever</text>
    <text x="1130" y="422" fill="#d9eef1">vantagens · desvantagens · dúvidas</text>

    <rect x="985" y="474" width="290" height="104" rx="12" fill="#186C7D"/>
    <text x="1130" y="516" fill="#fff" font-weight="bold" font-size="19">faculties_retriever</text>
    <text x="1130" y="544" fill="#d9eef1">onde estudar + link oficial</text>
  </g>

  <!-- Resultado -->
  <rect x="1360" y="235" width="220" height="190" rx="14" fill="#46C1A9"/>
  <g fill="#0B2B4C" text-anchor="middle">
    <text x="1470" y="285" font-size="20" font-weight="bold">3 opções</text>
    <text x="1470" y="310" font-size="20" font-weight="bold">justificadas</text>
    <text x="1470" y="345" font-size="16">próximos passos</text>
    <text x="1470" y="375" font-size="16">5 perguntas para</text>
    <text x="1470" y="397" font-size="16">um profissional</text>
  </g>
</svg>
