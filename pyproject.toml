[project]
name = "ainnovation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "pedrohspinheiro", email = "pedrosantospinheiro2002@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "ddgs>=9.16.1",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.2",
    "langgraph>=1.2.17",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
]

[project.scripts]
ainnovation = "ainnovation:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
